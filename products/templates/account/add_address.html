{% extends 'base.html' %}
{% block title %}Add Address - RedCart{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card border-0 shadow-lg rounded-4 p-5 theme-card">
        <h2 class="fw-bold mb-1 text-center text-gradient">➕ Add New Address</h2>
        <p class="text-center text-muted mb-4">Save an address for faster checkout</p>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name</label>
              <input 
                type="text" 
                name="full_name" 
                class="form-control form-control-lg rounded-pill px-4"
                placeholder="John Doe"
                required
              >
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input 
                type="tel" 
                name="phone" 
                class="form-control form-control-lg rounded-pill px-4"
                placeholder="+234 (0) 123 456 7890"
                required
              >
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Street Address</label>
            <input 
              type="text" 
              name="street_address" 
              class="form-control form-control-lg rounded-pill px-4"
              placeholder="123 Main Street"
              required
            >
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">City</label>
              <input 
                type="text" 
                name="city" 
                class="form-control form-control-lg rounded-pill px-4"
                placeholder="Lagos"
                required
              >
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">State</label>
              <input 
                type="text" 
                name="state" 
                class="form-control form-control-lg rounded-pill px-4"
                placeholder="Lagos State"
                required
              >
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Postal Code</label>
              <input 
                type="text" 
                name="postal_code" 
                class="form-control form-control-lg rounded-pill px-4"
                placeholder="100001"
                required
              >
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Address Type</label>
              <select name="address_type" class="form-select form-select-lg rounded-pill px-4">
                <option value="home">Home</option>
                <option value="work">Work</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_default" id="is_default">
              <label class="form-check-label" for="is_default">
                Set as default address
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-danger btn-lg w-100 rounded-pill fw-bold py-3">
            💾 Save Address
          </button>
        </form>

        <div class="text-center mt-4">
          <a href="{% url 'products:addresses' %}" class="link-danger">Back to addresses</a>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .text-gradient {
    background: linear-gradient(45deg, #ff6b6b, #ff9900);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
{% endblock %}
